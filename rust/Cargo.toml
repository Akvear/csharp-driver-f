[workspace]
members = [".", "ffi-type-derive"]

[package]
name = "csharp_wrapper"
version = "0.0.0"
edition = "2024"

[dependencies]
# Compile-time only: derives `FFIType`, which describes the layout of every type that crosses the
# FFI boundary so the managed side can be verified against it. Kept as a mandatory (not optional)
# dependency so that a plain `cargo build` type-checks every derive.
ffi-type-derive = { path = "ffi-type-derive" }
scylla = { version = "1.9.0", features = [
    "unstable-csharp-rs",
] }
scylla-cql-core = { version = "2.0.0", package = "scylla-cql" }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
thiserror = "2"
tracing = "0.1.41"
uuid = "1"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

[lib]
crate-type = ["cdylib", "lib"] # "lib" needed for doctests

[features]
integration_testing = []

[profile.dev]
# Setting `panic = "abort"` guarantees the process will terminate on
# panic instead of unwinding, avoiding undefined behavior across the FFI
# boundary and making the program's failure more deterministic.
panic = "abort"

[profile.release]
# Same for release builds: ensure no unwinding occurs across the FFI
# boundary when this library is used by managed code.
panic = "abort"

[dev-dependencies]
ntest = "0.9"

[lints.rust]
unsafe-op-in-unsafe-fn = "warn"
unnameable_types = "warn"
# unreachable_pub = "warn"
